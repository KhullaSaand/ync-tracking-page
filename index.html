<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Shipment</title>
<style>
  .ync-tracker * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

  .ync-tracker {
    max-width: 620px;
    margin: 0 auto;
    padding: 20px;
  }

  /* Search Box */
  .ync-search-wrap {
    background: #f8f8f8;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .ync-search-label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #1a1a2e;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .ync-search-row {
    display: flex;
    gap: 10px;
  }

  .ync-search-input {
    flex: 1;
    border: 2px solid #e5e5e5;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: monospace;
    color: #1a1a2e;
    outline: none;
    transition: border-color 0.2s;
  }

  .ync-search-input:focus { border-color: #e87722; }

  .ync-search-btn {
    background: #e87722;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .ync-search-btn:hover { background: #cf6510; }
  .ync-search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Error */
  .ync-error {
    background: #fff3f3;
    border: 1px solid #ffb3b3;
    color: #c0392b;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    margin-top: 12px;
    display: none;
  }

  /* Result Card */
  .ync-result { display: none; }

  .ync-card {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .ync-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }

  .ync-tracking-label {
    font-size: 11px;
    color: #999;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }

  .ync-tracking-num {
    font-family: monospace;
    font-size: 18px;
    font-weight: 800;
    color: #1a1a2e;
  }

  .ync-badge {
    background: #fff3e8;
    color: #e87722;
    border: 1px solid #f5c99a;
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .ync-info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .ync-info-item {
    background: #f8f8f8;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .ync-info-item .lbl {
    font-size: 11px;
    color: #999;
    margin-bottom: 3px;
  }

  .ync-info-item .val {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a2e;
  }

  .ync-info-item.full { grid-column: span 2; }

  /* Timeline */
  .ync-timeline-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #999;
    margin-bottom: 16px;
  }

  .ync-tl-item {
    display: flex;
    gap: 14px;
    padding-bottom: 18px;
  }

  .ync-tl-item:last-child { padding-bottom: 0; }

  .ync-tl-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 14px;
    flex-shrink: 0;
  }

  .ync-tl-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 2px solid #ddd;
    background: #fff;
    flex-shrink: 0;
    margin-top: 3px;
  }

  .ync-tl-dot.active {
    background: #e87722;
    border-color: #e87722;
  }

  .ync-tl-line {
    width: 2px;
    flex: 1;
    background: #e5e5e5;
    margin-top: 4px;
  }

  .ync-tl-status {
    font-size: 14px;
    font-weight: 700;
    color: #1a1a2e;
  }

  .ync-tl-status.active { color: #e87722; }

  .ync-tl-location {
    font-size: 12px;
    color: #777;
    margin-top: 2px;
  }

  .ync-tl-date {
    font-size: 11px;
    color: #aaa;
    margin-top: 2px;
  }

  @media (max-width: 480px) {
    .ync-info-grid { grid-template-columns: 1fr; }
    .ync-info-item.full { grid-column: span 1; }
    .ync-search-row { flex-direction: column; }
    .ync-search-btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="ync-tracker">

  <!-- Search -->
  <div class="ync-search-wrap">
    <label class="ync-search-label">Enter YNC Tracking Number</label>
    <div class="ync-search-row">
      <input type="text" class="ync-search-input" id="yncInput" placeholder="e.g. YNCL8XYZABC1" />
      <button class="ync-search-btn" id="yncBtn" onclick="trackShipment()">Track</button>
    </div>
    <div class="ync-error" id="yncError"></div>
  </div>

  <!-- Result -->
  <div class="ync-result" id="yncResult">

    <!-- Shipment Info -->
    <div class="ync-card">
      <div class="ync-card-top">
        <div>
          <div class="ync-tracking-label">Tracking Number</div>
          <div class="ync-tracking-num" id="resYnc"></div>
        </div>
        <div class="ync-badge" id="resBadge"></div>
      </div>
      <div class="ync-info-grid">
        <div class="ync-info-item">
          <div class="lbl">From</div>
          <div class="val" id="resFrom"></div>
        </div>
        <div class="ync-info-item">
          <div class="lbl">To</div>
          <div class="val" id="resTo"></div>
        </div>
        <div class="ync-info-item full" id="resCarrierWrap">
          <div class="lbl">Carrier</div>
          <div class="val" id="resCarrier"></div>
        </div>
      </div>
    </div>

    <!-- Timeline -->
    <div class="ync-card" id="resTimelineCard" style="display:none">
      <div class="ync-timeline-title">Shipment Journey</div>
      <div id="resTimeline"></div>
    </div>

  </div>
</div>

<script>
  const API = "https://ync-tracking.vercel.app";

  document.getElementById("yncInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") trackShipment();
  });

  async function trackShipment() {
    const input = document.getElementById("yncInput").value.trim();
    const errorEl = document.getElementById("yncError");
    const resultEl = document.getElementById("yncResult");
    const btn = document.getElementById("yncBtn");

    errorEl.style.display = "none";
    resultEl.style.display = "none";

    if (!input) {
      errorEl.textContent = "Please enter a YNC tracking number.";
      errorEl.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Tracking…";

    try {
      const res = await fetch(`${API}/api/track?ync=${encodeURIComponent(input)}`);
      const data = await res.json();

      if (data.error) {
        errorEl.textContent = data.error === "Tracking number not found"
          ? "No shipment found for this tracking number. Please check and try again."
          : data.error;
        errorEl.style.display = "block";
      } else {
        renderResult(data.shipment);
      }
    } catch(e) {
      errorEl.textContent = "Could not connect. Please try again.";
      errorEl.style.display = "block";
    }

    btn.disabled = false;
    btn.textContent = "Track";
  }

  function renderResult(s) {
    const statuses = s.statuses || [];
    const last = statuses[statuses.length - 1];

    document.getElementById("resYnc").textContent = s.ync_tracking_number;
    document.getElementById("resBadge").textContent = last ? last.status_text : "Shipment Created";
    document.getElementById("resFrom").textContent = s.from_zipcode || "—";
    document.getElementById("resTo").textContent = s.to_zipcode || "—";

    if (s.send_shipment_with) {
      document.getElementById("resCarrier").textContent = s.send_shipment_with;
      document.getElementById("resCarrierWrap").style.display = "block";
    } else {
      document.getElementById("resCarrierWrap").style.display = "none";
    }

    if (statuses.length > 0) {
      const tl = document.getElementById("resTimeline");
      tl.innerHTML = "";
      statuses.forEach((st, i) => {
        const isLast = i === statuses.length - 1;
        const date = new Date(st.status_date || st.created_at).toLocaleString();
        tl.innerHTML += `
          <div class="ync-tl-item">
            <div class="ync-tl-left">
              <div class="ync-tl-dot ${isLast ? 'active' : ''}"></div>
              ${!isLast ? '<div class="ync-tl-line"></div>' : ''}
            </div>
            <div>
              <div class="ync-tl-status ${isLast ? 'active' : ''}">${st.status_text}</div>
              ${st.location ? `<div class="ync-tl-location">📍 ${st.location}</div>` : ''}
              <div class="ync-tl-date">${date}</div>
            </div>
          </div>`;
      });
      document.getElementById("resTimelineCard").style.display = "block";
    } else {
      document.getElementById("resTimelineCard").style.display = "none";
    }

    document.getElementById("yncResult").style.display = "block";
  }
</script>

</body>
</html>
